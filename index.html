<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR RUSH — Cosmic Catch</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,#182b5c 0%,transparent 30%),
    radial-gradient(circle at 80% 80%,#34145c 0%,transparent 30%),
    #050713;
  color:white;
  overflow:hidden;
}

button,input{
  font:inherit;
}

.screen{
  width:100%;
  height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
}

.screen.active{
  display:flex;
}

.card{
  width:min(92%,520px);
  padding:32px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:25px;
  background:rgba(15,20,45,.82);
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  text-align:center;
}

.logo{
  font-size:clamp(38px,8vw,65px);
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,#6cf6ff,#b66cff,#fff);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:8px;
}

.subtitle{
  color:#aeb9d7;
  margin-bottom:25px;
}

.owner{
  color:#6cf6ff;
  font-weight:bold;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:15px 18px;
  border-radius:14px;
  border:1px solid #38466f;
  background:#090e22;
  color:white;
  outline:none;
  margin-bottom:14px;
}

input:focus{
  border-color:#6cf6ff;
  box-shadow:0 0 18px rgba(108,246,255,.2);
}

.btn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  cursor:pointer;
  font-weight:800;
  color:white;
  background:linear-gradient(90deg,#197cff,#9b3dff);
  box-shadow:0 8px 25px rgba(100,80,255,.3);
  transition:.2s;
  margin-top:8px;
}

.btn:hover{
  transform:translateY(-2px);
}

.small{
  color:#8f9bbd;
  font-size:13px;
  margin-top:15px;
}

#gameScreen{
  position:relative;
  width:100%;
  height:100vh;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

.topbar{
  position:absolute;
  z-index:5;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(96%,900px);
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.hud{
  padding:10px 12px;
  border-radius:14px;
  background:rgba(5,9,25,.72);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  text-align:center;
}

.hud b{
  display:block;
  color:#6cf6ff;
  font-size:12px;
  margin-bottom:3px;
}

.hud span{
  font-weight:900;
}

.playerHud{
  grid-column:1/-1;
  color:#fff;
}

.playerHud span{
  color:#c58cff;
}

.levelInfo{
  position:absolute;
  z-index:5;
  top:112px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  padding:8px 18px;
  border-radius:20px;
  background:rgba(5,9,25,.65);
  border:1px solid rgba(255,255,255,.1);
}

.levelInfo strong{
  color:#ffd75e;
}

.controls{
  position:absolute;
  z-index:6;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:15px;
}

.controlBtn{
  width:75px;
  height:60px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:rgba(10,15,35,.75);
  color:white;
  font-size:28px;
  cursor:pointer;
  touch-action:none;
}

.controlBtn:active{
  transform:scale(.94);
  background:rgba(70,90,180,.8);
}

.homeBtn{
  position:absolute;
  z-index:10;
  top:12px;
  right:12px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(10,15,35,.75);
  color:white;
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
}

.modal{
  position:absolute;
  z-index:20;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.result{
  width:min(90%,420px);
  padding:30px;
  border-radius:25px;
  background:#0c1129;
  border:1px solid rgba(255,255,255,.15);
  text-align:center;
}

.result h2{
  font-size:32px;
  margin-bottom:10px;
}

.result p{
  color:#b4bedb;
  line-height:1.7;
}

.result .btn{
  margin-top:15px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .card{
    padding:25px 20px;
  }

  .topbar{
    grid-template-columns:repeat(3,1fr);
  }

  .hud{
    padding:8px 5px;
    font-size:12px;
  }

  .playerHud{
    font-size:13px;
  }

  .levelInfo{
    top:105px;
    font-size:13px;
  }

  .controls{
    bottom:12px;
  }

  .controlBtn{
    width:68px;
    height:56px;
  }
}
</style>
</head>

<body>

<!-- HOME -->
<section id="homeScreen" class="screen active">
  <div class="card">
    <div class="logo">STAR RUSH</div>
    <div class="subtitle">COSMIC CATCH</div>

    <div class="owner">👑 Owner: Shahenshah</div>

    <input
      id="playerName"
      type="text"
      maxlength="18"
      placeholder="Enter your player name"
      autocomplete="off"
    >

    <button class="btn" onclick="startGame()">
      🚀 START GAME
    </button>

    <div class="small">
      ⭐ Catch stars • 💣 Avoid bombs • ⏱️ Survive until time ends
    </div>
  </div>
</section>

<!-- GAME -->
<section id="gameScreen" class="screen">

  <canvas id="gameCanvas"></canvas>

  <div class="topbar">

    <div class="hud playerHud">
      👤 PLAYER:
      <span id="hudPlayer">---</span>
    </div>

    <div class="hud">
      <b>LEVEL</b>
      <span id="hudLevel">1</span>
    </div>

    <div class="hud">
      <b>STARS</b>
      <span id="hudStars">0/5</span>
    </div>

    <div class="hud">
      <b>TIME</b>
      <span id="hudTime">40</span>
    </div>

  </div>

  <div class="levelInfo">
    🎯 Target: <strong id="targetText">5 Stars</strong>
  </div>

  <button class="homeBtn" onclick="goHome()">⌂ Home</button>

  <div class="controls">
    <button class="controlBtn" id="leftBtn">◀</button>
    <button class="controlBtn" id="rightBtn">▶</button>
  </div>

  <div class="modal" id="resultModal">
    <div class="result">

      <h2 id="resultTitle">LEVEL COMPLETE!</h2>

      <p id="resultText"></p>

      <button
        id="nextBtn"
        class="btn"
        onclick="nextLevel()">
        NEXT LEVEL 🚀
      </button>

      <button
        id="retryBtn"
        class="btn"
        onclick="retryLevel()">
        RETRY 🔄
      </button>

      <button
        class="btn"
        onclick="goHome()">
        HOME 🏠
      </button>

    </div>
  </div>

</section>

<script>
/* =========================================================
   STAR RUSH — COSMIC CATCH
   OWNER: SHAHENSHAH
   ========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let playing = false;
let paused = false;

let currentLevel = 1;
let collected = 0;
let targetStars = 5;
let timeLeft = 40;

let score = 0;
let bestScore = 0;
let totalStars = 0;

let objects = [];
let particles = [];
let starsBackground = [];

let timerId = null;
let animationId = null;

let leftPressed = false;
let rightPressed = false;

let playerName = "";

const SAVE_KEY = "starRushSave";
const NAME_KEY = "starRushPlayerName";

/* ---------- SAVE ---------- */

let save = {
  currentLevel:1,
  unlockedLevel:1,
  score:0,
  bestScore:0,
  totalStars:0,
  levelStars:{}
};

function loadGame(){

  try{

    const saved = JSON.parse(
      localStorage.getItem(SAVE_KEY)
    );

    if(saved){
      save = {
        ...save,
        ...saved
      };
    }

  }catch(e){
    console.log("Save load error",e);
  }

  playerName =
    localStorage.getItem(NAME_KEY) || "";

  if(playerName){
    document.getElementById("playerName").value =
      playerName;
  }

  currentLevel =
    Math.max(1, Math.min(30, save.currentLevel || 1));

  score = save.score || 0;
  bestScore = save.bestScore || 0;
  totalStars = save.totalStars || 0;
}

function saveGame(){

  save.currentLevel = currentLevel;
  save.score = score;
  save.bestScore = bestScore;
  save.totalStars = totalStars;

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

  localStorage.setItem(
    NAME_KEY,
    playerName
  );
}

/* ---------- CANVAS ---------- */

function resizeCanvas(){

  W = canvas.width =
    window.innerWidth * devicePixelRatio;

  H = canvas.height =
    window.innerHeight * devicePixelRatio;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

  W = window.innerWidth;
  H = window.innerHeight;

  createBackground();
}

window.addEventListener("resize", resizeCanvas);

/* ---------- BACKGROUND ---------- */

function createBackground(){

  starsBackground = [];

  for(let i=0;i<120;i++){

    starsBackground.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.8+.3,
      a:Math.random()*.8+.2
    });

  }
}

function drawBackground(){

  ctx.fillStyle="#040714";
  ctx.fillRect(0,0,W,H);

  const gradient =
    ctx.createRadialGradient(
      W*.5,H*.35,20,
      W*.5,H*.5,H
    );

  gradient.addColorStop(0,"#111b42");
  gradient.addColorStop(1,"#03050d");

  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  for(const s of starsBackground){

    ctx.globalAlpha=s.a;

    ctx.fillStyle="#ffffff";

    ctx.beginPath();
    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* ---------- PLAYER ---------- */

const player = {
  x:0,
  y:0,
  width:48,
  height:58,
  speed:7
};

function resetPlayer(){

  player.x =
    W/2;

  player.y =
    H-125;
}

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  // glow
  ctx.shadowBlur=25;
  ctx.shadowColor="#54eaff";

  // ship
  ctx.fillStyle="#65efff";

  ctx.beginPath();

  ctx.moveTo(0,-30);
  ctx.lineTo(25,25);
  ctx.lineTo(0,16);
  ctx.lineTo(-25,25);

  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur=0;

  // cockpit
  ctx.fillStyle="#ffffff";

  ctx.beginPath();

  ctx.arc(
    0,
    -8,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  // engine
  ctx.fillStyle="#9c5cff";

  ctx.beginPath();

  ctx.moveTo(-8,20);
  ctx.lineTo(0,38);
  ctx.lineTo(8,20);

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}

/* ---------- LEVEL DATA ---------- */

function getLevelData(level){

  return {

    target:
      4 + Math.floor(level * .65),

    time:
      Math.min(
        70,
        35 + Math.floor(level * 1.2)
      ),

    speed:
      2.2 + level*.13,

    bombChance:
      Math.min(.25, .08 + level*.005)

  };
}

/* ---------- OBJECTS ---------- */

function spawnObject(){

  const data =
    getLevelData(currentLevel);

  const isBomb =
    Math.random() < data.bombChance;

  objects.push({

    x:Math.random()*(W-60)+30,

    y:-40,

    r:isBomb ? 18 : 15,

    speed:
      data.speed +
      Math.random()*1.8,

    type:
      isBomb ? "bomb" : "star",

    rotation:
      Math.random()*Math.PI*2

  });
}

function drawStar(x,y,r){

  ctx.save();

  ctx.translate(x,y);

  ctx.shadowBlur=22;
  ctx.shadowColor="#ffd84d";

  ctx.fillStyle="#ffd84d";

  ctx.beginPath();

  for(let i=0;i<10;i++){

    const angle =
      -Math.PI/2 +
      i*Math.PI/5;

    const radius =
      i%2===0 ? r : r*.42;

    const px =
      Math.cos(angle)*radius;

    const py =
      Math.sin(angle)*radius;

    if(i===0)
      ctx.moveTo(px,py);
    else
      ctx.lineTo(px,py);
  }

  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawBomb(x,y,r){

  ctx.save();

  ctx.translate(x,y);

  ctx.shadowBlur=18;
  ctx.shadowColor="#ff3355";

  ctx.fillStyle="#242838";

  ctx.beginPath();
  ctx.arc(
    0,0,r,
    0,Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#ff4864";
  ctx.lineWidth=3;

  ctx.stroke();

  ctx.strokeStyle="#ffcc55";
  ctx.lineWidth=3;

  ctx.beginPath();

  ctx.moveTo(5,-r+2);
  ctx.quadraticCurveTo(
    12,-r-10,
    20,-r-4
  );

  ctx.stroke();

  ctx.restore();
}

/* ---------- PARTICLES ---------- */

function burst(x,y,type){

  for(let i=0;i<18;i++){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*6,

      vy:
        (Math.random()-.5)*6,

      life:1,

      type

    });

  }
}

function updateParticles(){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;
    p.life-=.035;

    if(p.life<=0){
      particles.splice(i,1);
      continue;
    }

    ctx.globalAlpha=p.life;

    ctx.fillStyle =
      p.type==="star"
      ? "#ffd84d"
      : "#ff4260";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* ---------- HUD ---------- */

function updateHUD(){

  document.getElementById("hudPlayer")
    .textContent=playerName;

  document.getElementById("hudLevel")
    .textContent=currentLevel;

  document.getElementById("hudStars")
    .textContent=
    collected+"/"+targetStars;

  document.getElementById("hudTime")
    .textContent=timeLeft;

  document.getElementById("targetText")
    .textContent=
    targetStars+" Stars";
}

/* ---------- COLLISION ---------- */

function collision(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  ) < b.r + 27;
}

/* ---------- START LEVEL ---------- */

function startLevel(){

  const data =
    getLevelData(currentLevel);

  targetStars=data.target;
  timeLeft=data.time;

  collected=0;

  objects=[];
  particles=[];

  resetPlayer();

  updateHUD();

  clearInterval(timerId);

  /*
    IMPORTANT:
    Level NEVER finishes just because targetStars
    has been collected.

    Timer is the main success check.
  */

  timerId=setInterval(()=>{

    if(!playing || paused)
      return;

    timeLeft--;

    updateHUD();

    if(timeLeft<=0){

      clearInterval(timerId);

      /*
        ONLY HERE:
        We decide whether the level is complete.
      */

      if(collected>=targetStars){

        finishLevel(true);

      }else{

        finishLevel(false);

      }

    }

  },1000);
}

/* ---------- GAME LOOP ---------- */

let lastSpawn=0;

function gameLoop(timestamp){

  if(!playing)
    return;

  drawBackground();

  if(!paused){

    // movement

    if(leftPressed)
      player.x-=player.speed;

    if(rightPressed)
      player.x+=player.speed;

    // keyboard

    if(keys["ArrowLeft"] || keys["a"])
      player.x-=player.speed;

    if(keys["ArrowRight"] || keys["d"])
      player.x+=player.speed;

    player.x=
      Math.max(
        30,
        Math.min(W-30,player.x)
      );

    // spawn

    if(timestamp-lastSpawn>520){

      spawnObject();

      lastSpawn=timestamp;

    }

    // objects

    for(let i=objects.length-1;i>=0;i--){

      const obj=objects[i];

      obj.y+=obj.speed;
      obj.rotation+=.04;

      if(obj.type==="star")
        drawStar(obj.x,obj.y,obj.r);
      else
        drawBomb(obj.x,obj.y,obj.r);

      // collision

      if(collision(player,obj)){

        if(obj.type==="star"){

          collected++;
          score+=10;
          totalStars++;

          burst(
            obj.x,
            obj.y,
            "star"
          );

          objects.splice(i,1);

          updateHUD();

          /*
            VERY IMPORTANT:
            NO finishLevel() HERE.

            Even if:
            collected >= targetStars

            the level CONTINUES until
            timer reaches 0.
          */

        }else{

          burst(
            obj.x,
            obj.y,
            "bomb"
          );

          objects.splice(i,1);

          // Bomb = immediate failure
          finishLevel(false,"bomb");

          return;
        }

      }

      if(obj.y>H+60){

        objects.splice(i,1);

      }

    }

  }

  drawPlayer();
  updateParticles();

  animationId=
    requestAnimationFrame(gameLoop);
}

/* ---------- FINISH ---------- */

function finishLevel(success,reason="time"){

  if(!playing)
    return;

  playing=false;

  clearInterval(timerId);

  save.score=score;

  if(score>bestScore){

    bestScore=score;
    save.bestScore=bestScore;

  }

  if(success){

    save.levelStars[currentLevel]=
      Math.max(
        save.levelStars[currentLevel]||0,
        collected
      );

    if(currentLevel>=save.unlockedLevel){

      save.unlockedLevel=
        Math.min(30,currentLevel+1);

    }

    /*
      Advance saved progress immediately.
      So reopening the game starts from the next level.
    */

    if(currentLevel<30){

      save.currentLevel=
        currentLevel+1;

    }else{

      save.currentLevel=30;

    }

  }else{

    /*
      Failure:
      Keep the same level saved.
    */

    save.currentLevel=currentLevel;

  }

  saveGame();

  const modal=
    document.getElementById("resultModal");

  const title=
    document.getElementById("resultTitle");

  const text=
    document.getElementById("resultText");

  const next=
    document.getElementById("nextBtn");

  const retry=
    document.getElementById("retryBtn");

  modal.classList.add("show");

  if(success){

    title.textContent=
      currentLevel>=30
      ? "🏆 ALL LEVELS COMPLETE!"
      : "⭐ LEVEL COMPLETE!";

    text.innerHTML=
      `Great job, <b>${escapeHTML(playerName)}</b>!<br>
       You collected <b>${collected}/${targetStars}</b> stars.<br>
       Score: <b>${score}</b>`;

    retry.classList.add("hidden");

    if(currentLevel>=30){

      next.classList.add("hidden");

    }else{

      next.classList.remove("hidden");

    }

  }else{

    title.textContent=
      reason==="bomb"
      ? "💥 BOOM!"
      : "⏰ TIME UP!";

    text.innerHTML=
      `<b>${escapeHTML(playerName)}</b>, you collected
       <b>${collected}/${targetStars}</b> stars.<br>
       You need <b>${targetStars}</b> stars to complete this level.`;

    next.classList.add("hidden");
    retry.classList.remove("hidden");

  }

}

/* ---------- NEXT ---------- */

function nextLevel(){

  if(currentLevel>=30)
    return;

  currentLevel++;

  save.currentLevel=
    currentLevel;

  saveGame();

  document.getElementById("resultModal")
    .classList.remove("show");

  playing=true;

  startLevel();

  cancelAnimationFrame(animationId);

  animationId=
    requestAnimationFrame(gameLoop);
}

/* ---------- RETRY ---------- */

function retryLevel(){

  document.getElementById("resultModal")
    .classList.remove("show");

  playing=true;

  startLevel();

  cancelAnimationFrame(animationId);

  animationId=
    requestAnimationFrame(gameLoop);
}

/* ---------- START GAME ---------- */

function startGame(){

  const input=
    document.getElementById("playerName");

  const name=
    input.value.trim();

  if(!name){

    input.focus();

    alert("Please enter your player name.");

    return;

  }

  playerName=name;

  localStorage.setItem(
    NAME_KEY,
    playerName
  );

  currentLevel=
    Math.max(
      1,
      Math.min(
        30,
        save.currentLevel||1
      )
    );

  document.getElementById("homeScreen")
    .classList.remove("active");

  document.getElementById("gameScreen")
    .classList.add("active");

  resizeCanvas();

  playing=true;
  paused=false;

  startLevel();

  cancelAnimationFrame(animationId);

  animationId=
    requestAnimationFrame(gameLoop);
}

/* ---------- HOME ---------- */

function goHome(){

  /*
    Save the exact current level before leaving.
    This makes sure reopening the game continues
    from the same level.
  */

  if(playing){

    save.currentLevel=currentLevel;

    save.score=score;

    saveGame();

  }

  playing=false;

  clearInterval(timerId);

  cancelAnimationFrame(animationId);

  document.getElementById("resultModal")
    .classList.remove("show");

  document.getElementById("gameScreen")
    .classList.remove("active");

  document.getElementById("homeScreen")
    .classList.add("active");
}

/* ---------- KEYBOARD ---------- */

const keys={};

window.addEventListener("keydown",e=>{

  keys[e.key]=true;

  if([
    "ArrowLeft",
    "ArrowRight",
    " "
  ].includes(e.key)){

    e.preventDefault();

  }

});

window.addEventListener("keyup",e=>{

  keys[e.key]=false;

});

/* ---------- MOBILE CONTROLS ---------- */

function setupButton(id,direction){

  const btn=
    document.getElementById(id);

  const down=e=>{

    e.preventDefault();

    if(direction==="left")
      leftPressed=true;
    else
      rightPressed=true;

  };

  const up=e=>{

    e.preventDefault();

    if(direction==="left")
      leftPressed=false;
    else
      rightPressed=false;

  };

  btn.addEventListener(
    "pointerdown",
    down
  );

  btn.addEventListener(
    "pointerup",
    up
  );

  btn.addEventListener(
    "pointercancel",
    up
  );

  btn.addEventListener(
    "pointerleave",
    up
  );

}

setupButton("leftBtn","left");
setupButton("rightBtn","right");

/* ---------- DRAG CONTROL ---------- */

let dragging=false;

canvas.addEventListener(
  "pointerdown",
  e=>{

    dragging=true;

    movePlayerToPointer(e);

  }
);

canvas.addEventListener(
  "pointermove",
  e=>{

    if(dragging)
      movePlayerToPointer(e);

  }
);

window.addEventListener(
  "pointerup",
  ()=>{
    dragging=false;
  }
);

function movePlayerToPointer(e){

  if(!playing)
    return;

  player.x=
    Math.max(
      30,
      Math.min(
        W-30,
        e.clientX
      )
    );

}

/* ---------- SAFE HTML ---------- */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* ---------- SAVE ON EXIT ---------- */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(playing){

      save.currentLevel=
        currentLevel;

      save.score=score;

      saveGame();

    }

  }
);

/* ---------- INIT ---------- */

loadGame();
resizeCanvas();

</script>
